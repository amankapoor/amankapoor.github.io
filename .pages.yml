media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    format: raw
    view:
      fields: [title, date]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: layout
        label: Layout
        type: string
        default: post
        hidden: true
      - name: body
        label: Content
        type: rich-text