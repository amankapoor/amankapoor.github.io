media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: '{year}-{month}-{day}-{primary}.md'
    view:
      fields: [title, date, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: published
        label: Published
        type: boolean
        default: true
        description: Turn off to keep this a draft. Jekyll skips it, so it gets no page and stays off the index and feed.
      - name: layout
        label: Layout
        type: string
        default: post
        hidden: true
      - name: image
        label: Thumbnail
        type: image
        description: Social preview image (og:image / twitter:image). 1200x630 JPG or PNG works best.
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
