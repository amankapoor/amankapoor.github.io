title: Aman Kapoor
description: Writing and notes.
url: "https://amankapoor.github.io"
baseurl: ""

theme: minima
permalink: /:title/

# Pages CMS stamps a date-only value (no time), which Jekyll reads as
# midnight. Build runners are UTC, so without this a post written between
# 00:00 and 05:30 IST is dated in the future and Jekyll silently drops it.
timezone: Asia/Kolkata

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Google Analytics 4 measurement ID, e.g. "G-ABC123XYZ". Paste it here to
# turn tracking on; leave empty to disable. Only rendered when the build runs
# with JEKYLL_ENV=production (the Pages workflow sets it), so local builds are
# never counted. The snippet lives in _includes/google-analytics.html.
google_analytics: ""

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
